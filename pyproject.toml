[project]
name = "uc-intg-oppo-music"
version = "0.1.0"
description = "Unfolded Circle integration: browse and play the OPPO Music library on an OPPO UDP-203/205"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ucapi==0.6.0"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]
